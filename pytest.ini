[pytest]
# Adds src/ to sys.path so that "from unit_tests_and_coverage.calculator import Calculator"
# works in tests without installing the package. The alternative — pip install -e . —
# requires a pyproject.toml describing the package metadata, which is unnecessary
# overhead for a teaching repo made of a few self-contained exercises.
pythonpath = src
# OR-Tools' compiled bindings (SWIG) trigger DeprecationWarnings inside Python's import machinery on
# Python 3.12. They come from the library, not from the exercises, so they are hidden here.
filterwarnings =
    ignore:builtin type .* has no __module__ attribute:DeprecationWarning
